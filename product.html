<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StarTone | Detail Product</title>

<link rel="shortcut icon" href="icon/StarTone Circle.png">

<meta property="og:title" content="StarTone Preset">
<meta property="og:description" content="Detail preset Adobe Lightroom premium StarTone.">
<meta property="og:image" content="">
<meta property="og:type" content="product">

<meta name="robots" content="index, follow">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

<style>
.product-detail-page{
    padding:120px 7% 60px;
    max-width:1160px;
    margin:0 auto;
    min-height:100vh;
}
.product-detail-loading, .product-detail-not-found{
    text-align:center;
    padding:80px 20px;
    color:var(--text-muted);
}
.product-detail-not-found i{ font-size:40px; color:#FFD166; margin-bottom:15px; display:block; }

/* ===================== */
/* ATAS: GALERI + INFO   */
/* ===================== */
.pd-top{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
    align-items:start;
}

.pd-main{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    background:#1a1a1c;
    aspect-ratio:16/9;
}
.pd-main img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}
.pd-search-btn{
    position:absolute;
    right:14px;
    bottom:14px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:rgba(20,20,22,.72);
    backdrop-filter:blur(4px);
    color:#fff;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:3;
    transition:background .2s var(--ease), transform .2s var(--ease);
}
.pd-search-btn:hover{
    background:var(--accent);
    color:#28282B;
    transform:scale(1.08);
}
.pd-thumbs{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:10px;
    margin-top:12px;
}
.pd-thumb{
    aspect-ratio:16/9;
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    border:2px solid transparent;
    opacity:.7;
    transition:opacity .2s, border-color .2s;
}
.pd-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.pd-thumb:hover{ opacity:1; }
.pd-thumb.active{ opacity:1; border-color:var(--accent); }

.pd-info .pill{ cursor:default; margin-bottom:8px; display:inline-block; }
.pd-info h1{ font-family:'Sora',sans-serif; font-size:32px; margin:6px 0 10px; }

.pd-rating-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
}
.pd-stars{ color:var(--accent); font-size:15px; letter-spacing:2px; }
.pd-rating-count{ color:var(--text-muted); font-size:13.5px; }

.pd-info .price{ font-size:28px; font-weight:700; color:#FFD166; margin-bottom:12px; }
.pd-info .short-desc{ color:var(--text-muted); margin-bottom:12px; line-height:1.7; }
.pd-sold{ color:var(--text-muted); font-size:14px; margin-bottom:6px; }
.pd-sold i{ color:var(--accent); margin-right:4px; }
.pd-compat{ color:var(--text-muted); font-size:14px; margin-bottom:22px; }
.pd-compat i{ margin-right:6px; }

.pd-qty-row{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin:6px 0 24px;
}
.pd-qty-box{
    display:flex;
    align-items:center;
    border:1px solid rgba(255,255,255,.15);
    border-radius:10px;
    overflow:hidden;
}
.pd-qty-btn{
    background:var(--bg-alt);
    border:none;
    color:#fff;
    width:38px;
    height:42px;
    font-size:18px;
    cursor:pointer;
    transition:background .2s;
}
.pd-qty-btn:hover{ background:var(--accent); color:#28282B; }
.pd-qty-box input{
    width:46px;
    height:42px;
    text-align:center;
    border:none;
    border-left:1px solid rgba(255,255,255,.15);
    border-right:1px solid rgba(255,255,255,.15);
    background:transparent;
    color:#fff;
    font-size:15px;
    font-family:inherit;
}
.pd-actions{ display:flex; gap:10px; flex-wrap:wrap; }
.pd-actions .btn-outline{ color:#fff; border-color:rgba(255,255,255,.3); }
.pd-category-line{ color:var(--text-muted); font-size:14px; }
.pd-category-line b{ color:#fff; font-weight:600; }

.product-detail-page .ba-gallery-wrap{ margin-top:55px; }

/* ===================== */
/* TAB DESKRIPSI/ULASAN  */
/* ===================== */
.pd-tabs-section{ margin-top:55px; }
.pd-tabs{
    display:flex;
    gap:6px;
    border-bottom:1px solid rgba(255,255,255,.12);
    margin-bottom:28px;
}
.pd-tab{
    background:none;
    border:none;
    color:var(--text-muted);
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    padding:12px 22px;
    cursor:pointer;
    position:relative;
    top:1px;
}
.pd-tab.active{ color:#fff; }
.pd-tab.active::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
}
.pd-panel h3{ margin-bottom:8px; font-size:18px; }
.pd-panel p{ color:#ccc; line-height:1.7; margin-bottom:22px; }

/* ---- Ringkasan rating ---- */
.pd-review-summary{
    display:grid;
    grid-template-columns:200px 1fr;
    gap:36px;
    align-items:center;
    background:var(--bg-alt);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:26px;
    margin-bottom:28px;
}
.pd-review-avg{ text-align:center; }
.pd-review-avg-num{ font-family:'Sora',sans-serif; font-size:44px; font-weight:800; color:#fff; line-height:1; }
.pd-review-avg-total{ display:block; color:var(--text-muted); font-size:12.5px; margin-top:8px; }
.pd-rating-bars{ display:flex; flex-direction:column; gap:8px; }
.pd-rating-bar-row{ display:grid; grid-template-columns:48px 1fr 26px; align-items:center; gap:10px; font-size:13px; color:var(--text-muted); }
.pd-rating-bar-row i{ color:var(--accent); font-size:11px; }
.pd-rating-bar-track{ height:8px; border-radius:20px; background:rgba(255,255,255,.08); overflow:hidden; }
.pd-rating-bar-fill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:20px; }
.pd-rating-bar-count{ text-align:right; }

/* ---- Daftar ulasan + form (2 kolom) ---- */
.pd-panel[data-panel="reviews"] #pdReviewsRoot{
    display:grid;
    grid-template-columns:1fr;
    gap:0;
}
.pd-review-list{ display:flex; flex-direction:column; gap:16px; margin-bottom:36px; }
.pd-review-item{
    background:var(--bg-alt);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:20px 22px;
}
.pd-review-item-top{ display:flex; align-items:center; gap:14px; margin-bottom:10px; }
.pd-review-item-top h4{ font-size:15.5px; margin-bottom:2px; }
.pd-review-date{ font-size:12px; color:var(--text-muted); }
.pd-review-empty{ color:var(--text-muted); text-align:center; padding:20px 0; }

.pd-review-form-wrap{
    background:var(--bg-alt);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:26px;
    max-width:520px;
}
.pd-review-form-wrap .review-modal-content input[type="email"]{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.1);
    background:var(--bg);
    color:#fff;
    font-size:14px;
    font-family:inherit;
}
.pd-review-form-wrap .review-modal-content input[type="email"]:focus{
    outline:none;
    border-color:var(--accent);
}
html[data-theme="light"] .pd-review-form-wrap .review-modal-content input[type="email"]{
    background:#ffffff;
    color:var(--text);
    border-color:rgba(0,0,128,.15);
}
.pd-review-form-wrap h3{ margin-bottom:4px; }
.pd-review-form-hint{ color:var(--text-muted); font-size:13.5px; margin-bottom:6px !important; }
.pd-form-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

@media (max-width:900px){
    .pd-top{ grid-template-columns:1fr; gap:25px; }
    .product-detail-page{ padding-top:90px; }
    .pd-review-summary{ grid-template-columns:1fr; text-align:center; }
    .pd-form-row{ grid-template-columns:1fr; }
}

html[data-theme="light"] .pd-review-summary,
html[data-theme="light"] .pd-review-item,
html[data-theme="light"] .pd-review-form-wrap{
    background:#fff;
    border-color:rgba(0,0,0,.08);
    box-shadow:0 10px 25px rgba(0,0,0,.06);
}
html[data-theme="light"] .pd-review-avg-num,
html[data-theme="light"] .pd-info h1,
html[data-theme="light"] .pd-review-item-top h4{ color:#1a1a1a; }
html[data-theme="light"] .pd-tab{ color:#666; }
html[data-theme="light"] .pd-tab.active{ color:#1a1a1a; }
html[data-theme="light"] .pd-qty-box input{ color:#1a1a1a; }
html[data-theme="light"] .pd-actions .btn-outline{ color:#1a1a1a; border-color:rgba(0,0,0,.2); }

/* =====================================================
   LIGHTBOX POPUP GALERI (layar 9:16) — dipakai oleh tombol
   search di pojok thumbnail utama & tombol kaca pembesar di
   galeri Before/After. Semua navigasi < > pakai animasi geser
   halus (lihat pdLightboxStage & keyframe di bawah).
===================================================== */
.pd-lightbox{
    position:fixed;
    inset:0;
    background:rgba(6,6,8,.94);
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:70px 20px 60px;
}
.pd-lightbox.active{ display:flex; }

.pd-lightbox-topbar{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 22px;
    z-index:2;
}
.pd-lightbox-counter{
    color:#fff;
    font-size:14px;
    font-weight:600;
    background:rgba(255,255,255,.08);
    padding:6px 14px;
    border-radius:20px;
}
.pd-lightbox-topbar-actions{ display:flex; gap:10px; }
.pd-lightbox-icon-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.08);
    color:#fff;
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .2s var(--ease), transform .2s var(--ease);
}
.pd-lightbox-icon-btn:hover{ background:var(--accent); color:#28282B; }
.pd-lightbox-icon-btn.active{ background:var(--accent); color:#28282B; }

.pd-lightbox-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:48px;
    height:48px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.08);
    color:#fff;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:2;
    transition:background .2s var(--ease), transform .2s var(--ease), opacity .2s var(--ease);
}
.pd-lightbox-arrow:hover:not(:disabled){ background:var(--accent); color:#28282B; transform:translateY(-50%) scale(1.08); }
.pd-lightbox-arrow:disabled{ opacity:.3; cursor:not-allowed; }
.pd-lightbox-arrow-prev{ left:18px; }
.pd-lightbox-arrow-next{ right:18px; }

.pd-lightbox-stage{
    position:relative;
    width:min(94vw, 50.6vh);
    aspect-ratio:9/16;
    max-height:78vh;
    background:#000;
    border-radius:16px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 25px 60px rgba(0,0,0,.5);
}
.pd-lightbox-stage img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    transition:opacity .22s var(--ease), transform .22s var(--ease);
    cursor:zoom-in;
}
.pd-lightbox-stage.zoomed img{
    object-fit:cover;
    transform:scale(1.6);
    cursor:zoom-out;
}
.pd-lightbox-stage.slide-out-left img{ opacity:0; transform:translateX(-30px); }
.pd-lightbox-stage.slide-out-right img{ opacity:0; transform:translateX(30px); }
.pd-lightbox-stage.slide-in-left img{ opacity:0; transform:translateX(-30px); }
.pd-lightbox-stage.slide-in-right img{ opacity:0; transform:translateX(30px); }

.pd-lightbox-caption{
    position:absolute;
    left:0; right:0;
    bottom:22px;
    text-align:center;
    color:#ddd;
    font-size:13px;
    z-index:2;
}

@media (max-width:600px){
    .pd-lightbox{ padding:60px 12px 50px; }
    .pd-lightbox-stage{ width:min(88vw, 62vh); max-height:74vh; }
    .pd-lightbox-arrow{ width:40px; height:40px; font-size:15px; }
    .pd-lightbox-arrow-prev{ left:8px; }
    .pd-lightbox-arrow-next{ right:8px; }
}
</style>

</head>

<body>

<div id="productDetailLoading" class="product-detail-loading">
    <p>Memuat produk...</p>
</div>

<div id="productDetailNotFound" class="product-detail-not-found" style="display:none;">
    <i class="fa-solid fa-magnifying-glass"></i>
    <h2>Produk tidak ditemukan</h2>
    <p>Produk ini mungkin sudah dihapus atau link-nya salah.</p>
    <a href="shop.html" class="btn btn-primary" style="margin-top:15px;display:inline-block;">Lihat Semua Produk</a>
</div>

<section class="product-detail-page" id="productDetailContent" style="display:none;"></section>

<!-- ===================== -->
<!-- LIGHTBOX POPUP GALERI -->
<!-- ===================== -->
<div class="pd-lightbox" id="pdLightbox" aria-hidden="true">

    <div class="pd-lightbox-topbar">
        <span class="pd-lightbox-counter" id="pdLightboxCounter">1 / 1</span>
        <div class="pd-lightbox-topbar-actions">
            <button type="button" class="pd-lightbox-icon-btn" id="pdLightboxZoomBtn" aria-label="Perbesar gambar">
                <i class="fa-solid fa-magnifying-glass-plus"></i>
            </button>
            <button type="button" class="pd-lightbox-icon-btn" id="pdLightboxFullscreenBtn" aria-label="Layar penuh">
                <i class="fa-solid fa-expand"></i>
            </button>
            <button type="button" class="pd-lightbox-icon-btn" id="pdLightboxCloseBtn" aria-label="Tutup">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <button type="button" class="pd-lightbox-arrow pd-lightbox-arrow-prev" id="pdLightboxPrevBtn" aria-label="Gambar sebelumnya">
        <i class="fa-solid fa-chevron-left"></i>
    </button>

    <div class="pd-lightbox-stage" id="pdLightboxStage">
        <img id="pdLightboxImage" src="" alt="">
    </div>

    <button type="button" class="pd-lightbox-arrow pd-lightbox-arrow-next" id="pdLightboxNextBtn" aria-label="Gambar berikutnya">
        <i class="fa-solid fa-chevron-right"></i>
    </button>

    <div class="pd-lightbox-caption" id="pdLightboxCaption"></div>

</div>

<div id="footer-placeholder"></div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/toast.js"></script>
<script src="js/buy-product.js"></script>
<script src="js/back-button.js"></script>

<script type="module" src="js/product-detail.js"></script>

<script src="js/footer.js"></script>
