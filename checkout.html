<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>StarTone | Checkout</title>

<link rel="icon" href="icon/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="icon" href="icon/startone-logo.png" sizes="512x512" type="image/png">
<link rel="shortcut icon" href="icon/favicon-32x32.png">
<link rel="apple-touch-icon" href="icon/apple-touch-icon.png">

<meta name="description"
content="Checkout pembelian preset Lightroom StarTone.">

<meta name="robots"
content="noindex,nofollow">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>

:root{
    --bg:#090909;
    --bg-alt:#35363A;
    --accent:#FFD166;
    --accent-2:#ff9e6d;
    --ease:cubic-bezier(.25,.8,.25,1);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Plus Jakarta Sans',sans-serif;
}

h1{ font-family:'Sora','Plus Jakarta Sans',sans-serif; letter-spacing:-.02em; }

@keyframes flowFadeUp{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
}

/* ===== Progress Steps ===== */
.flow-steps{
    max-width:520px;
    margin:0 auto 36px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    animation:flowFadeUp .5s var(--ease) both;
}
.flow-step{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; }
.flow-step-num{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700;
    background:rgba(255,255,255,.06);
    border:1.5px solid rgba(255,255,255,.16);
    color:#8a8a8f;
    transition:.35s var(--ease);
}
.flow-step-label{ font-size:11.5px; color:#8a8a8f; font-weight:600; text-align:center; letter-spacing:.2px; }
.flow-step::after{
    content:"";
    position:absolute;
    top:17px; left:calc(50% + 24px);
    width:calc(100% - 48px);
    height:2px;
    background:rgba(255,255,255,.1);
    z-index:0;
}
.flow-step:last-child::after{ display:none; }
.flow-step.done .flow-step-num{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); border-color:transparent; color:#28282B; }
.flow-step.done .flow-step-label{ color:#fff; }
.flow-step.done::after{ background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
.flow-step.active .flow-step-num{ background:var(--bg); border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 5px rgba(255,209,102,.15); animation:flowPulse 1.8s infinite; }
.flow-step.active .flow-step-label{ color:var(--accent); }
@keyframes flowPulse{
    0%,100%{ box-shadow:0 0 0 5px rgba(255,209,102,.15); }
    50%{ box-shadow:0 0 0 9px rgba(255,209,102,.05); }
}
@media (max-width:480px){
    .flow-step-label{ font-size:9.5px; }
    .flow-step-num{ width:28px; height:28px; font-size:11px; }
    .flow-step::after{ top:14px; }
}

.tutorial{
    max-width:900px;
    margin:auto;
}

.step{
    background:#35363A;
    padding:25px 30px;
    margin-bottom:20px;
    border-left:6px solid #FFD166;
    border-radius:12px;
    transition:.3s;
}

.step:hover{
    transform:translateX(8px);
}

.step h3{
    color:#FFD166;
    margin-bottom:10px;
    font-size:22px;
}

.step p{
    color:#ddd;
    line-height:1.8;
}

body{

background:var(--bg);
color:white;
padding:50px;

}

.container{

max-width:900px;
margin:auto;

background:var(--bg-alt);

padding:40px;

border-radius:20px;
border:1px solid rgba(255,255,255,.06);
box-shadow:0 25px 60px rgba(0,0,0,.4);
position:relative;
overflow:hidden;
animation:flowFadeUp .6s var(--ease) both;

}

.container::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:4px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
}



h1{

margin-bottom:30px;

}

.row{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

}

input{

width:100%;

padding:15px;

margin-bottom:20px;

background:var(--bg);

border:1px solid rgba(255,255,255,.08);

border-radius:10px;

color:white;

font-size:15px;

transition:.25s var(--ease);

}

input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(255,209,102,.15);
}

.summary{

margin-top:30px;

background:var(--bg);
border:1px solid rgba(255,255,255,.06);

padding:25px;

border-radius:15px;

}

.item{

display:flex;

justify-content:space-between;

margin:15px 0;

}

.total{

font-size:22px;

font-weight:bold;

margin-top:20px;

}

/* Honeypot anti-bot: disembunyikan dari manusia tapi tetap ada di DOM
   supaya bot otomatis yang mengisi semua field akan terjebak. */
.honeypot-field{
    position:absolute;
    left:-9999px;
    top:-9999px;
    height:0;
    width:0;
    overflow:hidden;
}

.cf-turnstile{
    margin-top:20px;
}

button{

width:100%;

margin-top:35px;

padding:16px;

border:none;

border-radius:10px;

background:linear-gradient(90deg,var(--accent),var(--accent-2));

font-size:18px;

font-weight:600;
color:#28282B;

cursor:pointer;
transition:.3s var(--ease);
box-shadow:0 12px 28px rgba(255,209,102,.18);

}

.section-title{
    text-align:left;
    margin-bottom:40px;
    font-size:40px;
    font-weight:700;
}

button:hover{

transform:translateY(-3px);
box-shadow:0 16px 32px rgba(255,209,102,.3);

}

@media (max-width:992px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media (max-width:768px){
    .grid{
        grid-template-columns:1fr;
    }
}

#loadingScreen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(9,9,9,.97);
    backdrop-filter:blur(6px);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
    opacity:0;
    animation:loadingFadeIn .35s var(--ease) forwards;
}
@keyframes loadingFadeIn{ to{ opacity:1; } }

.loader{
    position:relative;
    width:72px;
    height:72px;
    margin-bottom:28px;
}
.loader::before, .loader::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:5px solid transparent;
}
.loader::before{
    border-top-color:var(--accent);
    border-right-color:var(--accent);
    animation:spin 1s linear infinite;
}
.loader::after{
    inset:12px;
    border-bottom-color:var(--accent-2);
    opacity:.6;
    animation:spin 1.4s linear infinite reverse;
}

@keyframes spin{

    100%{
        transform:rotate(360deg);
    }

}

#loadingScreen h2{
    color:white;
    margin-bottom:10px;
    animation:loadingTextPulse 1.8s ease-in-out infinite;
}

@keyframes loadingTextPulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.55; }
}

#loadingScreen p{
    color:#bbb;
}

/* ========================================== */
/* KODE RESPONSIF SMARTPHONE (TAMBAHAN BARU)  */
/* ========================================== */
@media (max-width: 768px) {
    body {
        padding: 20px 12px; /* Mengurangi padding luar di layar HP */
    }

    .container {
        padding: 25px 15px; /* Memperluas area form di dalam kotak */
        border-radius: 15px;
    }

    h1 {
        font-size: 26px; /* Menyesuaikan ukuran judul utama */
        margin-bottom: 20px;
    }

    .row {
        grid-template-columns: 1fr; /* Nama Depan dan Belakang otomatis menumpuk atas-bawah */
        gap: 0;
    }

    input {
        padding: 12px;
        font-size: 14px;
        margin-bottom: 15px;
    }

    label {
        font-size: 14px;
    }

    .summary {
        padding: 20px 15px;
        margin-top: 20px;
    }

    .summary h2 {
        font-size: 20px;
    }

    .item {
        font-size: 14px;
        margin: 10px 0;
    }

    .total {
        font-size: 18px;
        margin-top: 15px;
    }

    button {
        padding: 14px;
        font-size: 16px;
        margin-top: 25px;
    }
}

@media (max-width: 480px) {
    body {
        padding: 15px 8px;
    }

    .container {
        padding: 20px 12px;
    }

    h1 {
        font-size: 22px;
    }
}

</style>

</head>

<body>

<div class="flow-steps">
    <div class="flow-step done"><div class="flow-step-num"><i class="fa-solid fa-check"></i></div><div class="flow-step-label">Konfirmasi</div></div>
    <div class="flow-step done"><div class="flow-step-num"><i class="fa-solid fa-check"></i></div><div class="flow-step-label">Syarat</div></div>
    <div class="flow-step active"><div class="flow-step-num">3</div><div class="flow-step-label">Checkout</div></div>
    <div class="flow-step"><div class="flow-step-num">4</div><div class="flow-step-label">Pembayaran</div></div>
</div>

<div class="container">

<h1>Checkout</h1>

<form id="checkoutForm">

<div class="row">

<div>

<label>Nama Depan</label>

<input
type="text"
id="firstName"
name="firstName"
minlength="1"
maxlength="60"
autocomplete="given-name"
required>

</div>

<div>

<label>Nama Belakang</label>

<input
type="text"
id="lastName"
name="lastName"
minlength="1"
maxlength="60"
autocomplete="family-name"
required>

</div>

</div>

<label>Email</label>

<input
type="email"
id="customerEmail"
name="customerEmail"
autocomplete="email"
required>

<label>Nomor Telepon</label>

<input
type="tel"
id="customerPhone"
name="customerPhone"
inputmode="numeric"
pattern="[0-9+ -]{9,15}"
title="Masukkan nomor telepon yang valid (9-15 digit)"
placeholder="08xxxxxxxxxx"
autocomplete="tel"
required>

<div class="summary">

<h2>Your Order</h2>

<div class="item">
    <span id="productName"></span>
    <span id="productPrice"></span>
</div>

<hr>

<div class="item">
    <strong>Subtotal</strong>
    <strong id="subtotal"></strong>
</div>

<div class="item total">
    <span>Total</span>
    <span id="total"></span>
</div>

</div>

<!-- Honeypot anti-bot: field ini disembunyikan dari manusia lewat CSS.
     Bot otomatis biasanya tetap mengisi semua field yang ada di HTML,
     jadi kalau field ini terisi, submission dianggap spam & ditolak. -->
<div class="honeypot-field" aria-hidden="true">
    <label for="website">Jangan isi kolom ini</label>
    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
</div>

<!-- Cloudflare Turnstile (CAPTCHA gratis). Ganti data-sitekey di bawah
     dengan Site Key asli dari dashboard Cloudflare kamu (Turnstile). -->
<div class="cf-turnstile" data-sitekey="0x4AAAAAAD4j4xQkrfiYctfS" data-theme="dark" id="turnstileWidget"></div>

<button type="submit">

Lanjut ke Pembayaran

</button>

</form>

</div>

<script>

</script>

<script>

const name = localStorage.getItem("productName");
const price = Number(localStorage.getItem("productPrice"));

document.getElementById("productName").innerText = name;
document.getElementById("productPrice").innerText =
"Rp" + price.toLocaleString("id-ID");

document.getElementById("subtotal").innerText =
"Rp" + price.toLocaleString("id-ID");

document.getElementById("total").innerText =
"Rp" + price.toLocaleString("id-ID");


</script>

<div id="loadingScreen">

    <div class="loader"></div>

    <h2>Memproses Pesanan...</h2>

    <p>Mohon tunggu sebentar</p>

</div>

<script type="module" src="js/checkout.js"></script>



<script src="js/back-button.js"></script>

</body>

</html>
